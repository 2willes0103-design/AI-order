<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃甚麼?</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --text: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin-top: 2rem;
        }

        .view {
            display: none;
            width: 100%;
            animation: fadeIn 0.4s ease;
        }

        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .btn {
            padding: 1.2rem 1.5rem;
            border-radius: 16px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1.1rem;
            width: 100%;
            margin-bottom: 1.2rem;
            display: block;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        input,
        textarea {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            margin-bottom: 1.5rem;
            font-size: 1rem;
        }

        input:focus {
            outline: 2px solid var(--primary);
            border-color: transparent;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.25rem;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .qty-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
            transition: background 0.2s;
        }

        .qty-btn:hover {
            background: var(--primary);
        }

        .qty-val {
            min-width: 25px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .tag-closed {
            background: #ef4444;
            color: white;
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .tag-open {
            background: #22c55e;
            color: white;
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        #loader {
            text-align: center;
            margin: 2rem;
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #admin-menu-preview {
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 12px;
            margin-top: 1rem;
        }

        /* 浮動結帳欄樣式 */
        .cart-bar {
            position: fixed;
            bottom: -100px;
            /* 預設隱藏在底部 */
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 580px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.3);
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .cart-bar.active {
            bottom: 20px;
        }

        .cart-info {
            text-align: left;
        }

        .cart-total {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text);
        }

        .cart-count {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .btn-cart {
            width: auto;
            margin-bottom: 0;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
        }

        /* 分類導覽列樣式 */
        .category-nav {
            position: sticky;
            top: 0;
            background: var(--bg);
            padding: 10px 0;
            margin: -1rem -1rem 1.5rem -1rem;
            display: flex;
            overflow-x: auto;
            gap: 10px;
            z-index: 100;
            scrollbar-width: none;
            /* Firefox */
            padding-left: 1rem;
            padding-right: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .category-nav::-webkit-scrollbar {
            display: none;
        }

        /* Chrome/Safari */

        .cat-tag {
            flex: 0 0 auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cat-tag:hover,
        .cat-tag.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- View: Home -->
        <div id="view-home" class="view active">
            <div class="card">
                <h1
                    style="font-size: 2.5rem; margin-bottom: 1rem; background: linear-gradient(to right, #818cf8, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                    今天吃甚麼?</h1>
                <p style="margin-bottom: 2.5rem; color: #94a3b8;">AI菜單辨識平台</p>
                <button class="btn btn-primary" onclick="showView('view-login')">🍴 我要點餐</button>
                <button class="btn btn-outline" onclick="showView('view-admin')">⚙️ 管理員模式</button>
            </div>
        </div>

        <!-- View: Login -->
        <div id="view-login" class="view">
            <div class="card">
                <h2>姓名確認</h2>
                <p style="margin-bottom: 1.5rem; color: #94a3b8;">請輸入訂購人姓名以開始點餐</p>
                <input type="text" id="userName" placeholder="例如：名字取幽默一點">
                <button class="btn btn-primary" onclick="proceedToRestaurant()">進入點餐系統</button>
                <button class="btn btn-outline" onclick="showView('view-home')">返回首頁</button>
            </div>
        </div>

        <!-- View: Restaurant Selection -->
        <div id="view-res-select" class="view">
            <h2 style="margin-bottom: 1.5rem; text-align:center;">今日開放餐廳</h2>
            <div id="res-list">
                <!-- 動態顯示 -->
            </div>
            <button class="btn btn-outline" onclick="showView('view-home')">返回首頁</button>
        </div>

        <!-- View: Ordering -->
        <div id="view-order" class="view">
            <div class="card" id="active-res-name" style="padding: 1.5rem; margin-bottom: 1rem;"></div>

            <!-- 分類導覽列容器 -->
            <div id="category-nav-container" class="category-nav"></div>

            <div id="menu-container"></div>

            <button class="btn btn-outline" onclick="showView('view-home')">首頁</button>
        </div>

        <!-- View: Confirm -->
        <div id="view-confirm" class="view">
            <div class="card">
                <h2 style="margin-bottom: 0.5rem;">確認訂單內容</h2>
                <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem;">請檢查下方項目是否正確</p>
                <div id="order-review-container" style="text-align: left; margin-bottom: 1.5rem; background: rgba(0,0,0,0.2); border-radius: 16px; padding: 1rem;">
                    <!-- 動態顯示 -->
                </div>
                <h3 style="text-align: left; margin-bottom: 0.8rem; font-size: 1rem; color: var(--secondary);">📝 備註事項</h3>
                <h3 style="text-align: left; margin-bottom: 0.8rem; font-size: 0.7rem;">※因應店家狀況，備註事項會盡量做調整，但無法保證完全符合</h3>
                <textarea id="orderNote" placeholder="例：飯一半、便當加唐心蛋(+10)"></textarea>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-outline" onclick="showView('view-order')" style="flex: 1;">返回修改</button>
                    <button class="btn btn-primary" id="submitOrderBtn" onclick="submitOrder()" style="flex: 2;">正式送出訂單</button>
                </div>
            </div>
        </div>

        <!-- View: Summary -->
        <div id="view-summary" class="view">
            <div class="card">
                <div style="font-size: 4rem; margin-bottom: 1rem;">✅</div>
                <h2 style="color: #22c55e; margin-bottom: 0.5rem;">訂單發送成功！</h2>
                <p style="color: #94a3b8;">訂單已成功送出</p>
            </div>
            <button class="btn btn-primary" onclick="showAllOrders('view-summary')">其他人點什麼</button>
            <button class="btn btn-outline" onclick="showView('view-admin')">進入管理員模式</button>
            <button class="btn btn-outline" onclick="location.reload()">回到首頁開始新點餐</button>
        </div>

        <!-- View: All Orders -->
        <div id="view-all-orders" class="view">
            <div class="card" style="text-align:left; padding:1.5rem;">
                <h2 style="margin-bottom:1.5rem; text-align:center;">所有訂單</h2>
                <div id="all-orders-container"></div>
            </div>
            <button class="btn btn-outline" onclick="showAllOrders(previousView)">重新整理</button>
            <button id="orders-back-btn" class="btn btn-outline" onclick="showView('view-summary')">返回</button>
        </div>

        <!-- View: Admin -->
        <div id="view-admin" class="view">
            <div class="card">
                <div id="admin-current-status"
                    style="margin-bottom: 2rem; padding: 1.5rem; border-radius:24px; background:rgba(30, 41, 59, 0.4); border: 1px solid rgba(255,255,255,0.1); text-align: center;">
                    <!-- 這裡會動態顯示 麥當勞 (營業中) -->
                    <h2 id="status-text" style="margin:0; font-size:1.6rem; color:#94a3b8;">載入中...</h2>
                </div>

                <hr style="opacity:0.1; margin-bottom:1.5rem;">

                <div id="admin-library-section" style="margin-bottom: 2rem; text-align: left;">
                    <h3 style="margin-bottom: 1rem; color: var(--secondary); font-size: 1.1rem;">🏛️ 餐廳資料庫 (快速開團)</h3>
                    <div id="library-list"
                        style="max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 12px; padding: 0.5rem;">
                        <p style="color: #64748b; padding: 1rem; text-align: center;">載入資料庫中...</p>
                    </div>
                </div>

                <hr style="opacity:0.1; margin-bottom:1.5rem;">

                <h3> AI影像拍照辨識</h3>
                <p style="color: #94a3b8; font-size: 0.8rem; margin-bottom: 1rem;">PS:每天僅能上傳20次圖片辨識</p>
                <input type="text" id="newResName" placeholder="輸入餐廳名稱 (例如：芳琳鲁肉飯)">

                <div style="text-align: left; margin-bottom: 1rem;">
                    <label style="display:block; margin-bottom: 0.5rem; font-size: 0.9rem;">上傳菜單照片：</label>
                    <input type="file" id="menuUpload" accept="image/*">
                </div>

                <div id="admin-loader" style="display:none;">
                    <div class="spinner"></div>
                    <p>AI 正在辨識菜單項目...</p>
                </div>

                <div id="admin-menu-preview"
                    style="display:none; max-height: 300px; overflow-y: auto; margin-bottom: 1.5rem;"></div>

                <div id="admin-actions" style="display:none; margin-bottom: 1rem; gap: 10px;">
                    <!-- 移除不適用按鈕 -->
                </div>

                <button class="btn btn-primary" id="save-to-lib-btn" onclick="saveToLibraryOnly()">建立新開團</button>
                <button class="btn btn-outline" onclick="showAllOrders('view-admin')">查看其他人點什麼</button>
                <button class="btn btn-outline" onclick="showView('view-home')">返回首頁</button>
            </div>
        </div>
    </div>

    <!-- 浮動結帳欄 -->
    <div id="floating-cart" class="cart-bar">
        <div class="cart-info">
            <div class="cart-count">已選擇 <span id="total-qty">0</span> 份餐點</div>
            <div class="cart-total">總計 $<span id="total-price">0</span></div>
        </div>
        <button class="btn btn-primary btn-cart" onclick="showConfirmOrder()">確認送出</button>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <p>正在連線中...</p>
    </div>

    <script>
        // 自動判斷是在本機開發還是透過伺服器開啟
        const GAS_URL = window.location.protocol === 'file:' ? "http://localhost:5000/proxy" : "/proxy";
        let activeRestaurant = "";
        let menuData = [];
        let orderDetails = {};
        let previousView = 'view-summary';

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            window.scrollTo(0, 0);

            // 如果進入管理員介面，自動抓取狀態
            if (viewId === 'view-admin') {
                fetchAdminStatus();
                loadLibrary();
            }
        }

        async function loadLibrary() {
            const listDiv = document.getElementById('library-list');
            try {
                const res = await fetch(`${GAS_URL}?action=get_library`);
                if (!res.ok) throw new Error('伺服器回傳錯誤');
                const data = await res.json();

                if (!data.restaurants || data.restaurants.length === 0) {
                    listDiv.innerHTML = `<p style="color: #64748b; padding: 1rem; text-align: center;">資料庫暫無資料</p>`;
                    return;
                }

                listDiv.innerHTML = data.restaurants.map(name => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05);">
                    <span style="font-weight:600;">${name}</span>
                    <div style="display:flex; gap:8px;">
                        <button class="btn btn-primary" onclick="activateFromLibrary('${name}')" style="width:auto; padding: 6px 12px; font-size:0.8rem; margin:0;">🚀 直接開團</button>
                        <button onclick="deleteFromLibrary('${name}')" style="border:2px solid #ef4444; color:#ef4444; background:transparent; padding:6px 12px; border-radius:12px; font-size:0.8rem; font-weight:600; cursor:pointer;">刪除</button>
                    </div>
                </div>
            `).join('');
            } catch (e) { listDiv.innerHTML = `<p style="color: #ef4444; padding: 1rem;">載入失敗: ${e.message}</p>`; }
        }

        async function initOrdersSheet() {
            document.getElementById('loader').style.display = 'block';
            try {
                const res = await fetch(`${GAS_URL}?action=init_orders_sheet`);
                const result = await res.json();
                if (result.status === 'success') {
                    alert('試算表欄位已更新！Orders 分頁現在包含「金額」欄位。');
                } else {
                    throw new Error(result.error || '更新失敗');
                }
            } catch (e) {
                alert('更新失敗: ' + e.message);
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        async function activateFromLibrary(name) {
            if (!confirm(`確定要切換至「${name}」並開始訂餐嗎？`)) return;
            document.getElementById('loader').style.display = 'block';
            try {
                // 1. 抓取該餐廳菜單
                const resMenu = await fetch(`${GAS_URL}?action=get_menu_from_library&name=${encodeURIComponent(name)}`);
                const dataMenu = await resMenu.json();

                // 2. 設定為當前活動餐廳
                const payload = {
                    action: 'set_active_restaurant',
                    restaurant_name: name,
                    menu: dataMenu.menu
                };

                const resActive = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (resActive.ok) {
                    alert(`已成功切換至 ${name}！訂餐者現在可以看到菜單了。`);
                    location.reload();
                } else { throw new Error('切換失敗'); }
            } catch (e) { alert('操作失敗: ' + e.message); }
            finally { document.getElementById('loader').style.display = 'none'; }
        }

        async function deleteFromLibrary(name) {
            if (!confirm(`確定要從資料庫刪除「${name}」嗎？`)) return;
            document.getElementById('loader').style.display = 'block';
            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'delete_from_library', restaurant_name: name })
                });
                const result = await res.json();
                if (result.status === 'success') {
                    loadLibrary();
                } else {
                    throw new Error(result.error || '刪除失敗');
                }
            } catch (e) { alert('刪除失敗: ' + e.message); }
            finally { document.getElementById('loader').style.display = 'none'; }
        }

        async function saveToLibraryOnly() {
            const resName = document.getElementById('newResName').value;
            if (!resName) return alert('請填寫本次要建立的餐廳名稱');
            if (adminRecognizedMenu.length === 0) return alert('請先上傳照片進行 AI 辨識');

            const btn = document.getElementById('save-to-lib-btn');
            btn.disabled = true;
            btn.innerText = "正在儲存至資料庫...";

            const payload = {
                action: 'save_to_library',
                restaurant_name: resName,
                menu: adminRecognizedMenu
            };

            try {
                document.getElementById('loader').style.display = 'block';
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await res.json();
                if (res.ok && !result.error) {
                    alert('已建立新開團項目！請從上方「餐廳資料庫」清單中點選「🚀 直接開團」來正式開放訂餐。');

                    // 清空當前內容，讓使用者看到已經存進去了
                    document.getElementById('newResName').value = "";
                    document.getElementById('menuUpload').value = "";
                    document.getElementById('admin-menu-preview').style.display = 'none';
                    document.getElementById('admin-actions').style.display = 'none';
                    adminRecognizedMenu = [];

                    // 重新載入列表
                    loadLibrary();
                    window.scrollTo(0, 0);
                } else {
                    throw new Error(result.error || '儲存失敗');
                }
            } catch (e) {
                alert('操作失敗: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "建立新開團";
                document.getElementById('loader').style.display = 'none';
            }
        }

        // 移除不適用的邏輯 (setActiveRestaurant)

        async function fetchAdminStatus() {
            const statusDiv = document.getElementById('admin-current-status');
            try {
                const res = await fetch(`${GAS_URL}?action=get_status&_t=${Date.now()}`);
                if (!res.ok) throw new Error('伺服器回傳錯誤');
                const data = await res.json();
                if (data.active_restaurant) {
                    statusDiv.innerHTML = `
                    <div style="display:flex; justify-content:center; align-items:center; gap:12px; flex-wrap:wrap;">
                        <h2 style="margin:0; font-size:1.6rem; color:#22c55e;">${data.active_restaurant}</h2>
                        <span style=" color:white; font-size:0.8rem; padding:4px 12px; border-radius:20px; font-weight:600;">(營業中)</span>
                        <button style="border:2px solid #ef4444; color:#ef4444; background:transparent; padding:6px 14px; border-radius:12px; font-size:0.85rem; font-weight:600; cursor:pointer;" onclick="closeOrdering()">結束營業</button>
                    </div>
                `;
                } else {
                    statusDiv.innerHTML = `<h2 style="margin:0; font-size:1.6rem; color:#94a3b8;">(尚未開團)</h2>`;
                }
            } catch (e) {
                statusDiv.innerHTML = `<h2 style="margin:0; font-size:1.4rem; color:#ef4444;">連線失敗: ${e.message}</h2>`;
            }
        }

        async function closeOrdering() {
            if (!confirm('確定要結束目前的訂餐並關閉團購嗎？')) return;
            document.getElementById('loader').style.display = 'block';
            try {
                const payload = { action: 'set_active_restaurant', restaurant_name: '', menu: [] };
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error('伺服器回傳錯誤');
                alert('訂餐已成功關閉');
                location.reload();
            } catch (e) {
                alert('關閉失敗: ' + e.message);
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        // --- User Logic ---
        async function proceedToRestaurant() {
            const name = document.getElementById('userName').value;
            if (!name) return alert('請先輸入您的姓名');

            document.getElementById('loader').style.display = 'block';
            try {
                const res = await fetch(`${GAS_URL}?action=get_status&_t=${Date.now()}`, {
                    method: 'GET',
                    cache: 'no-cache'
                });
                if (!res.ok) throw new Error('GAS Proxy 回傳錯誤: ' + res.status);
                const data = await res.json();
                if (data.error) throw new Error(data.error);

                activeRestaurant = data.active_restaurant;
                menuData = data.menu;

                if (activeRestaurant) {
                    // 直接進入點餐畫面，跳過選擇步驟
                    startOrdering();
                } else {
                    // 如果沒有開團，顯示提示畫面
                    renderRestaurantSelection();
                    showView('view-res-select');
                }
            } catch (e) {
                console.error(e);
                alert('連線至 Google 服務失敗！\n原因：' + e.message);
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        function renderRestaurantSelection() {
            const container = document.getElementById('res-list');

            if (!activeRestaurant) {
                container.innerHTML = `
                <div class="card" style="opacity: 0.8; border-style: dashed;">
                    <h3 style="color: #94a3b8; margin: 1rem 0;">目前暫無任何開放點餐</h3>
                    <p style="font-size: 0.9rem; color: #64748b;">請稍候或聯繫管理員開團</p>
                </div>
            `;
                return;
            }

            container.innerHTML = `
            <div class="card" style="padding: 1.5rem; border: 2px solid var(--primary); box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);" onclick="startOrdering()">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="text-align:left;">
                        <span class="tag-open" style="margin-bottom:0.5rem; display:inline-block;">開放點餐中</span>
                        <h2 style="margin:0; font-size:1.8rem;">${activeRestaurant}</h2>
                    </div>
                    <div style="font-size:1.5rem;">👉</div>
                </div>
                <p style="text-align:left; color:#94a3b8; margin-top:1rem; font-size:0.9rem;">點擊上方區塊即可開始選購餐點</p>
            </div>
        `;
        }

        function startOrdering() {
            renderOrderHeader();
            renderMenu();
            showView('view-order');
        }

        function renderOrderHeader() {
            const name = document.getElementById('userName').value;
            document.getElementById('active-res-name').innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; gap:15px; text-align:left;">
                <h2 style="margin:0; font-size:1.3rem; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${activeRestaurant}</h2>
                <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
                    <span style="font-size:0.9rem; color:#94a3b8; white-space:nowrap;">訂購人:</span>
                    <input type="text" value="${name}" oninput="updateUserName(this.value)" 
                        style="width: 100px; padding: 8px 12px; margin-bottom:0; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); border-radius:10px; font-weight:600; color:var(--primary); font-size:0.95rem;">
                </div>
            </div>
        `;
        }

        window.updateUserName = (val) => {
            document.getElementById('userName').value = val;
        };

        let currentFilter = "";

        function renderMenu() {
            const container = document.getElementById('menu-container');
            const navContainer = document.getElementById('category-nav-container');

            if (menuData.length === 0) {
                container.innerHTML = `<p style="margin: 2rem 0;">這間餐廳目前的菜單是空的，請通知管理員。</p>`;
                navContainer.style.display = 'none';
            } else {
                navContainer.style.display = 'flex';

                // Group by category
                const grouped = menuData.reduce((acc, item) => {
                    const cat = item.category || "一般項";
                    if (!acc[cat]) acc[cat] = [];
                    acc[cat].push(item);
                    return acc;
                }, {});

                const categories = Object.keys(grouped);
                // 預設選取第一個分類
                if (!currentFilter || !categories.includes(currentFilter)) {
                    currentFilter = categories[0];
                }

                // 生成分類導覽標籤
                navContainer.innerHTML = categories.map(cat => `
                <div class="cat-tag ${cat === currentFilter ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}</div>
            `).join('');

                // 只生成當前選取分類的內容
                const items = grouped[currentFilter];
                container.innerHTML = `
                <div style="text-align:left; margin-bottom:1rem; padding-left:0.5rem; border-left:4px solid var(--secondary);">
                    <h3 style="color:var(--secondary);">${currentFilter}</h3>
                </div>
                ${items.map(item => `
                    <div class="menu-item">
                        <div style="text-align:left; flex:1;">
                            <div style="font-weight:600; font-size:1.1rem;">${item.name}</div>
                            <div style="color:#94a3b8; font-weight:700;">$${item.price || '--'}</div>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateQty('${item.name}', -1)">-</button>
                            <span class="qty-val" id="qty-${item.name}">${orderDetails[item.name] || 0}</span>
                            <button class="qty-btn" onclick="updateQty('${item.name}', 1)">+</button>
                        </div>
                    </div>
                `).join('')}
            `;
            }
        }

        // 點選分類標籤 (過濾模式)
        window.selectCategory = (cat) => {
            currentFilter = cat;
            renderMenu();
            window.scrollTo(0, 0);
        };

        window.updateQty = (name, delta) => {
            if (!orderDetails[name]) orderDetails[name] = 0;
            orderDetails[name] = Math.max(0, orderDetails[name] + delta);
            document.getElementById(`qty-${name}`).innerText = orderDetails[name];

            updateFloatingBar();
        };

        function updateFloatingBar() {
            const cart = document.getElementById('floating-cart');
            let totalQty = 0;
            let totalPrice = 0;

            // 遍歷所有已點品項計算總額
            Object.entries(orderDetails).forEach(([name, qty]) => {
                if (qty > 0) {
                    totalQty += qty;
                    // 從 menuData 找出單價
                    const item = menuData.find(m => m.name === name);
                    if (item) {
                        const price = parseFloat(item.price) || 0;
                        totalPrice += price * qty;
                    }
                }
            });

            document.getElementById('total-qty').innerText = totalQty;
            document.getElementById('total-price').innerText = totalPrice;

            // 只有在點餐畫面且數量 > 0 時才顯示
            const isOrderView = document.getElementById('view-order').classList.contains('active');
            if (totalQty > 0 && isOrderView) {
                cart.classList.add('active');
            } else {
                cart.classList.remove('active');
            }
        }

        // 在切換畫面時也要檢查是否要隱藏浮動欄
        const originalShowView = showView;
        window.showView = (viewId) => {
            originalShowView(viewId);
            updateFloatingBar();
        };

        async function submitOrder() {
            const items = Object.entries(orderDetails)
                .filter(([_, qty]) => qty > 0)
                .map(([name, qty]) => {
                    const found = menuData.find(m => m.name === name);
                    return { name, qty, price: found ? (parseFloat(found.price) || 0) : 0 };
                });

            if (items.length === 0) return alert('您還沒有選擇任何餐點喔！');

            const btn = document.getElementById('submitOrderBtn');
            btn.disabled = true;
            btn.innerText = "訂單傳送中...";

            const payload = {
                action: 'submit_order',
                restaurant_name: activeRestaurant,
                user_name: document.getElementById('userName').value,
                items: items,
                note: document.getElementById('orderNote').value
            };

            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    cache: 'no-cache', // 避免緩存
                    body: JSON.stringify(payload)
                });
                
                const result = await res.json();
                console.log("GAS 回傳結果:", JSON.stringify(result));

                if (result.status === "success") {
                    showView('view-summary');
                } else {
                    throw new Error(result.error || `GAS 回傳異常: ${JSON.stringify(result)}`);
                }
                
            } catch (e) {
                console.error("提交失敗:", e);
                alert('寫入試算表失敗！\n原因: ' + e.message);
                btn.disabled = false;
                btn.innerText = "正式送出訂單";
            }
        }

        function showConfirmOrder() {
            const container = document.getElementById('order-review-container');
            const items = Object.entries(orderDetails)
                .filter(([_, qty]) => qty > 0)
                .map(([name, qty]) => {
                    const item = menuData.find(m => m.name === name);
                    return { name, qty, price: item ? (parseFloat(item.price) || 0) : 0 };
                });

            if (items.length === 0) return alert('您還沒有選擇任何餐點喔！');

            let total = 0;
            container.innerHTML = items.map(item => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                return `
                <div style="display:flex; justify-content:space-between; margin-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.05); padding-bottom:8px;">
                    <span>${item.name} x ${item.qty}</span>
                    <span style="font-weight:600;">$${subtotal}</span>
                </div>
            `;
            }).join('') + `
            <div style="display:flex; justify-content:space-between; margin-top:10px; font-weight:700; font-size:1.2rem; color:var(--primary);">
                <span>總計</span>
                <span>$${total}</span>
            </div>
        `;

            showView('view-confirm');
        }

        async function showAllOrders(fromView = 'view-summary') {
            previousView = fromView;
            const backBtn = document.getElementById('orders-back-btn');
            if (backBtn) backBtn.setAttribute('onclick', `showView('${fromView}')`);

            document.getElementById('loader').style.display = 'block';
            try {
                const res = await fetch(`${GAS_URL}?action=get_all_orders&_t=${Date.now()}`);
                const data = await res.json();
                const container = document.getElementById('all-orders-container');

                if (data.error) {
                    container.innerHTML = `<p style="color:#ef4444; text-align:center; padding:1rem;">GAS 回傳錯誤：${data.error}</p>`;
                } else if (!data.orders || data.orders.length === 0) {
                    container.innerHTML = `<p style="color:#94a3b8; text-align:center;">目前還沒有任何訂單</p>`;
                } else {
                    // 統一格式：相容舊版陣列格式與新版物件格式
                    const normalized = data.orders.map(o => {
                        if (Array.isArray(o)) {
                            // 新欄位：餐廳(0), 訂購人(1), 餐點(2), 數量(3), 金額(4), 備註(5)
                            // 舊欄位：時間(0), 訂購人(1), 項目(2), 數量(3), 備註(4)
                            const isNew = o.length >= 6;
                            return {
                                user: o[1] || '',
                                item: o[2] || '',
                                qty: o[3] || 0,
                                amount: isNew ? (o[4] || 0) : 0,
                                note: isNew ? (o[5] || '') : (o[4] || '')
                            };
                        }
                        return o;
                    });

                    // 表頭
                    const tableHeader = `
                        <div style="display:grid; grid-template-columns:2fr 3fr 1fr 1.5fr; gap:4px; padding:8px 4px; border-bottom:2px solid rgba(255,255,255,0.15); margin-bottom:6px; font-size:0.85rem; color:#94a3b8; font-weight:600;">
                            <span>訂購人</span><span>餐點</span><span style="text-align:center;">數量</span><span style="text-align:right;">金額</span>
                        </div>`;

                    // 每筆訂單列
                    let grandTotal = 0;
                    const rows = normalized.map(o => {
                        grandTotal += parseFloat(o.amount) || 0;
                        return `
                        <div style="display:grid; grid-template-columns:2fr 3fr 1fr 1.5fr; gap:4px; padding:8px 4px; border-bottom:1px solid rgba(255,255,255,0.05); font-size:0.95rem; align-items:center;">
                            <span style="font-weight:600; color:var(--primary);">${o.user}</span>
                            <span>${o.item}${o.note ? `<br><span style="font-size:0.75rem; color:#94a3b8;">備註：${o.note}</span>` : ''}</span>
                            <span style="text-align:center;">${o.qty}</span>
                            <span style="text-align:right; font-weight:600;">$${o.amount}</span>
                        </div>`;
                    }).join('');

                    // 合計列
                    const totalRow = `
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:1rem; padding:12px 4px; border-top:2px solid rgba(255,255,255,0.2);">
                            <span style="font-weight:700;">合計</span>
                            <span style="font-weight:700; font-size:1.2rem; color:var(--secondary);">$${grandTotal}</span>
                        </div>`;

                    container.innerHTML = tableHeader + rows + totalRow;
                }
                showView('view-all-orders');
            } catch (e) {
                alert('載入失敗: ' + e.message);
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        // --- Admin Logic ---
        const menuUpload = document.getElementById('menuUpload');
        let adminRecognizedMenu = [];

        menuUpload.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('admin-loader').style.display = 'block';
            document.getElementById('admin-menu-preview').style.display = 'none';

            const formData = new FormData();
            formData.append('image', file);

            try {
                const RECOGNIZE_URL = window.location.protocol === 'file:' ? 'http://localhost:5000/recognize' : '/recognize';
                const response = await fetch(RECOGNIZE_URL, { method: 'POST', body: formData });
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(`HTTP ${response.status}: ${text.substring(0, 200)}`);
                }
                const data = await response.json();
                if (data.items) {
                    adminRecognizedMenu = data.items;
                    renderAdminPreview();
                    document.getElementById('admin-actions').style.display = 'flex';
                } else {
                    alert('辨識失敗: ' + (data.error || 'API 回傳異常'));
                }
            } catch (err) {
                alert('辨識錯誤: ' + err.message);
            } finally {
                document.getElementById('admin-loader').style.display = 'none';
            }
        };

        function renderAdminPreview() {
            const preview = document.getElementById('admin-menu-preview');
            preview.style.display = 'block';
            preview.innerHTML = "<h4 style='margin-bottom:1rem;'>辨識清單預覽 (可編輯分類/名稱/價格)</h4>" + adminRecognizedMenu.map((item, id) => `
            <div style="display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; background:rgba(255,255,255,0.05); padding:10px; border-radius:12px;">
                <input type="text" value="${item.category || ''}" placeholder="分類" onchange="adminRecognizedMenu[${id}].category=this.value" style="margin:0; width:80px; padding:6px; font-size:0.8rem; background:rgba(236, 72, 153, 0.2);">
                <input type="text" value="${item.name}" onchange="adminRecognizedMenu[${id}].name=this.value" style="margin:0; flex:2; padding:8px;">
                <input type="number" value="${item.price}" onchange="adminRecognizedMenu[${id}].price=this.value" style="margin:0; width:70px; padding:8px;">
                <button class="qty-btn" onclick="adminRecognizedMenu.splice(${id},1); renderAdminPreview();" style="background:#ef4444; width:30px; height:30px;">×</button>
            </div>
        `).join('');
        }

        async function setActiveRestaurant() {
            const resName = document.getElementById('newResName').value;
            if (!resName) return alert('請填寫本次要開團的餐廳名稱');
            if (adminRecognizedMenu.length === 0) return alert('請先上傳照片進行 AI 辨識');

            const payload = {
                action: 'set_active_restaurant',
                restaurant_name: resName,
                menu: adminRecognizedMenu
            };

            try {
                document.getElementById('loader').style.display = 'block';
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await res.json();
                if (res.ok && !result.error) {
                    // 發布成功後，同步自動存入資料庫
                    const payloadSave = {
                        action: 'save_to_library',
                        restaurant_name: resName,
                        menu: adminRecognizedMenu
                    };
                    await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payloadSave) });

                    alert('開團成功！菜單已自動存入資料庫，訂餐者現在可以看到新的餐廳與菜單。');
                    location.reload();
                } else {
                    throw new Error(result.error || '發佈失敗');
                }
            } catch (e) {
                alert('發佈失敗: ' + e.message);
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }
    </script>
</body>

</html>
